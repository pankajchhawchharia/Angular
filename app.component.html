<div>
    <h2>User Registration Form</h2>
    <form [formGroup]='userForm' (ngSubmit)='onSubmit()'>
        <label>Name: </label>
        <input type='text'
    formControlName='name'>
        <div class="error" *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid">
            <small *ngIf="userForm.get('name')?.errors?.required">
      Name is required
            </small>
            <small *ngIf="userForm.get('name')?.errors?.minlength">
      Minimum 3 characters required
            </small>
        </div>
        <br/>
        <label>Address</label>
        <input type='text' formControlName='address'>
        <div class='error' *ngIf="userForm.get('address')?.touched && userForm.get('address')?.invalid">
            <small>address is required</small>
        </div>
        <br/>
        <label>mobile number</label>
        <input type='text'
        formControlName='mobile'>
        <div class='error' *ngIf="userForm.get('mobile')?.touched && userForm.get('mobile')?.invalid">
            <small *ngIf="userForm.get('mobile')?.errors?.required">
            mobile number is required</small>
            <small *ngIf="userForm.get('mobile')?.patter">
                enter valid 10 digit number 
            </small>
        </div>
        <br/>
        <label> pincode</label>
        <input type='text'
        formControlName='pincode'>
        <div class='error' *ngIf="userForm.get('pincode')?.touched && userForm.get('pincode')?.invalid">
            <small *ngIf="userForm.get('pincode')?.errors?.required">
            pincode is required
        </small>
            <small *ngIf="userForm.get('pincode')?.errors?.pattern">
            pincode valid 6 digit 
        </small>
        </div>
        <br/>

        <button type='submit'>Submit</button>
    </form>
    <hr />
    <h3> submitted data</h3>
    <table>
        <tr>
            <th>name</th>
            <th>address</th>
            <th>mobile</th>
            <th>pincode</th>
        </tr>
        <tr *ngFor='let user of submittedData'>
            <td>{{user.name}}</td>
            <td>{{user.address}}</td>
            <td>{{user.mobile}}</td>
            <td>{{user.pincode}}</td>

        </tr>
    </table>
</div>
