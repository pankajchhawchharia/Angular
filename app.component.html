<div>
  <h2>User Registration Form</h2>
  <form #userForm="ngForm" (ngSubmit)="addUser(userForm)">
    <div>
      <label>Name: </label>
      <input
        type="text"
        name="name"
        [(ngModel)]="user.name"
        #name="ngModel"
        required
      />
      <div *ngIf="name.invalid && name.touched">name is required</div>
    </div>
    <br />
    <div>
      <label>Address: </label>
      <input
        name="address"
        [(ngModel)]="user.address"
        #address="ngModel"
        required
      />
      <div class="error" *ngIf="address.invalid && address.touched">
        Address is required
      </div>
    </div>
    <br />
    <div>
      <label>Mobile: </label>

      <input
        type="text"
        name="mobile"
        [(ngModel)]="user.mobile"
        #mobile="ngModel"
        required
        pattern="^[0-9]{10}$"
      />

      <div *ngIf="mobile.invalid && mobile.touched">
        <div *ngIf="mobile.errors?.required">Mobile number is required</div>

        <div *ngIf="mobile.errors?.pattern">Enter valid 10 digit number</div>
      </div>
    </div>
    <br />
    <div>
      <label>Pin code: </label>

      <input
        type="text"
        name="pincode"
        [(ngModel)]="user.pincode"
        #pincode="ngModel"
        required
        pattern="^[0-9]{6}$"
      />

      <div class="error" *ngIf="pincode.invalid && pincode.touched">
        <div *ngIf="pincode.errors?.required">Pin code is required</div>

        <div *ngIf="pincode.errors?.pattern">Enter valid 6 digit pin code</div>
      </div>
    </div>
    <button type="submit" [disabled]="userForm.invalid">Submit</button>
  </form>
  <hr />
  <table *ngIf="userList.length > 0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Address</th>
        <th>Mobile</th>
        <th>Pin Code</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of userList">
        <td>{{ item.name }}</td>
        <td>{{ item.address }}</td>
        <td>{{ item.mobile }}</td>
        <td>{{ item.pincode }}</td>
      </tr>
    </tbody>
  </table>
</div>
